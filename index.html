<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emirates English Practice Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#232b35;font:17px/1.6 Arial,sans-serif}main{max-width:900px;margin:auto;padding:32px 20px}h1{line-height:1.2}header{border-top:6px solid #9b2335;padding:18px 0}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin:18px 0}legend{font-weight:bold;padding:0 0 14px}fieldset{border:0;margin:0;min-width:0}label{display:block;padding:9px 12px;border-radius:6px;margin:5px 0;border:1px solid #dedee3;cursor:pointer}label:hover{background:#f5f1ec}input{margin-right:10px;accent-color:#9b2335}.ok{background:#e8f5ed!important;border-color:#36845b}.wrong{background:#fdebee!important;border-color:#b64d5b}.feedback{margin-top:14px}button{font:inherit;background:#9b2335;color:white;border:0;padding:11px 20px;border-radius:7px;cursor:pointer;margin:5px}button.secondary{background:#374556}.toolbar{position:sticky;top:0;background:#f5f3eff5;padding:12px 0;border-bottom:1px solid #ddd;z-index:2}#result{font-weight:bold}summary{cursor:pointer;font-weight:bold}.key{columns:3}footer{font-size:13px;color:#657080}@media(max-width:500px){main{padding:18px 12px}.card{padding:16px}.key{columns:2}}@media print{body{background:white;font-size:11pt}.toolbar,.feedback,footer{display:none}.card{break-inside:avoid;margin:10px 0;padding:12px}details{break-before:page}.key{columns:3}}
</style><main><header><h1>Emirates English Practice Test</h1><p>30 multiple-choice questions · Choose one answer for each blank.</p><p>Practice version based on the supplied PDF. Minor spelling and wording errors have been corrected.</p><label>Name: <input type="text" aria-label="Student name"></label></header><div class="toolbar"><span id="progress">0 / 30 answered</span><br><button id="check">Check answers</button><button class="secondary" id="reset">Try again</button><button class="secondary" onclick="window.print()">Print</button><div id="result" role="status" aria-live="polite"></div></div><form id="quiz"></form><details><summary>Teacher answer key</summary><ol class="key" id="key"></ol></details><footer>Independent practice adaptation of the uploaded test.</footer></main><script>
const data=[{"q": "The passenger was briefed by the crew to place her baggage________ the seat in front of her as the overhead compartment was full.", "o": ["Above", "Between", "Under", "In"], "a": 2, "e": "Under means below the seat."}, {"q": "Customers________ smoke on board the aircraft. It is prohibited.", "o": ["May", "Must not", "Might not", "Should"], "a": 1, "e": "Must not expresses prohibition."}, {"q": "Reserved seating is the policy in the movie theatre. You should sit in your________ seat to avoid disturbing others.", "o": ["Assigned", "Random", "Vacant", "Cancelled"], "a": 0, "e": "Assigned means allocated to a particular person."}, {"q": "If I’d had a bigger carry on, I would have brought all my electronic ________ with me. I packed my tablet but had to leave my laptop behind.", "o": ["Tools", "Materials", "Devices", "Appliances"], "a": 2, "e": "Tablets and laptops are electronic devices."}, {"q": "You must extinguish your cigarette________ entering the building as smoking is not permitted inside under any circumstances.", "o": ["At", "After", "Prior to", "While"], "a": 2, "e": "Prior to means before."}, {"q": "A decision was ________ to temporarily close the swimming pool during the winter months.", "o": ["Taken", "Done", "Make", "Said"], "a": 0, "e": "Take a decision is a valid collocation; the passive form is was taken."}, {"q": "Air traffic controllers need to have strong ________ skills to give clear instructions to pilots via radio.", "o": ["Extension", "Communication", "Demonstration", "Completion"], "a": 1, "e": "Clear instructions require communication skills."}, {"q": "It is a ________ for all trainees to wear the correct uniform.", "o": ["Requirement", "Qualification", "Revision", "Regulations"], "a": 0, "e": "A requirement is something obligatory."}, {"q": "Fitness trackers allow you to ________ your heart rate while exercising.", "o": ["Checks", "Obtained", "Monitor", "Damage"], "a": 2, "e": "After allow you to, use the base verb: monitor."}, {"q": "What is the baby’s ________? If she is too heavy, it won’t be safe to put her in the cot.", "o": ["Height", "Weight", "Length", "Width"], "a": 1, "e": "Weight tells us how heavy something is."}, {"q": "Did you ________ your supervisors to check if there are any changes to your duties over the holiday period?", "o": ["Support", "Present", "Contact", "Discuss"], "a": 2, "e": "Contact someone means communicate with them."}, {"q": "The client angrily________ a refund when he discovered the product had a defect.", "o": ["Demanded", "Applied", "Confirmed", "Performed"], "a": 0, "e": "Demanded means asked firmly for something."}, {"q": "The car is ________ with a warning light that comes on when the fuel tank is nearing empty.", "o": ["Operate", "Inflated", "Move", "Fitted"], "a": 3, "e": "Fitted with means equipped with."}, {"q": "How much money do you make ________ hour?", "o": ["Per", "For", "In", "During"], "a": 0, "e": "Per hour means for each hour."}, {"q": "As a safety ________, doctors and nurses shall don a mask to cover their mouth and nose when interacting with patients.", "o": ["Description", "Precaution", "Caution", "Prevention"], "a": 1, "e": "A safety precaution is an action taken to reduce risk."}, {"q": "Don’t slam the door, gently pull it closed by the ________", "o": ["Handle", "Button", "Switch", "lock"], "a": 0, "e": "A handle is the part used to pull a door."}, {"q": "It is important to be ________ when checking your work for errors. Double check everything slowly and carefully.", "o": ["Thorough and detailed", "Correct and rapid", "Realistic and rushed", "Attention and careless"], "a": 0, "e": "Thorough and detailed describes careful checking."}, {"q": "He ________ the key in the lock to open the metal container.", "o": ["Rotated", "Completed", "Signaled", "Blocked"], "a": 0, "e": "Rotated means turned."}, {"q": "Check your luggage on arrival to ensure no one has ________ with it. It looks like someone has broken the lock.", "o": ["Opened", "Tampered", "Damaged", "Touched"], "a": 1, "e": "Tamper with means interfere with something without permission."}, {"q": "It is ________ for cyclists to put on a high visibility vest so that motorists can see them at night.", "o": ["Relevant", "Designed", "Necessary", "Available"], "a": 2, "e": "Necessary means needed."}, {"q": "The firefighters wore protective hoods to minimize the ________ of exposure to fire.", "o": ["Risk", "Safety", "Condition", "Incident"], "a": 0, "e": "Risk is the possibility of harm."}, {"q": "The customer was shouting and swearing at the bartender. His behavior was hardly ________.", "o": ["Appropriate", "Applicable", "Decent", "Inappropriate"], "a": 0, "e": "Hardly appropriate means almost certainly unsuitable."}, {"q": "Always familiarize yourself with the location of the emergency________ in a building in case of a sudden evacuation.", "o": ["Access", "Exits", "Effects", "Environment"], "a": 1, "e": "Emergency exits are routes out of a building."}, {"q": "The trainer is sick today. Do you think the training________?", "o": ["Will be happen", "Will postpone", "Won’t be scheduling", "Will be cancelled"], "a": 3, "e": "Will be cancelled is the future passive form."}, {"q": "The elevator is ________ maintenance today. Go to the classroom via the stairs.", "o": ["In", "Over", "Under", "Between"], "a": 2, "e": "Under maintenance means being serviced or repaired."}, {"q": "This course has both ________ and theoretical components. In other words, you will need to show your learning through actions and also explain it through writing.", "o": ["Digital", "Effective", "Standard", "Practical"], "a": 3, "e": "Practical components involve putting learning into action."}, {"q": "According to the company manual, you shall not accept an item for return________ the customer is able to produce a receipt.", "o": ["Unless", "Regardless", "Despite", "Except"], "a": 0, "e": "Unless means except if."}, {"q": "During the descent, several climbers collapsed from ________. It was a long and tiring journey.", "o": ["Awareness", "Aid", "Fatigue", "Fumes"], "a": 2, "e": "Fatigue means extreme tiredness."}, {"q": "The departure of the ferry was delayed by an hour as the crowd refused to ________ with the crew’s instructions to stay seated.", "o": ["Sit", "Comply", "Control", "Understood and follow"], "a": 1, "e": "Comply with means follow instructions or rules."}, {"q": "Unfortunately there are many cases of passengers attempting to transport ________ items on the aircraft in their hand luggage, including flammable liquids, toxic substances and lithium batteries. These are hazardous items that are either restricted or not permitted on board at all.", "o": ["Electrical", "Dangerous", "Secure", "Harmless"], "a": 1, "e": "Dangerous describes items that can cause harm."}];
const quiz=document.getElementById('quiz');
data.forEach((x,i)=>{const card=document.createElement('div');card.className='card';const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=(i+1)+'. '+x.q;field.append(legend);x.o.forEach((o,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode('ABCD'[j]+'. '+o));field.append(label)});const feedback=document.createElement('div');feedback.className='feedback';feedback.hidden=true;field.append(feedback);card.append(field);quiz.append(card);const item=document.createElement('li');item.textContent='ABCD'[x.a]+' — '+x.o[x.a];document.getElementById('key').append(item)});
function progress(){document.getElementById('progress').textContent=quiz.querySelectorAll('input:checked').length+' / 30 answered'}
quiz.addEventListener('change',progress);
quiz.addEventListener('submit',e=>e.preventDefault());
document.getElementById('check').onclick=()=>{let score=0,answered=0;[...quiz.children].forEach((card,i)=>{const chosen=card.querySelector('input:checked');const x=data[i];const labels=card.querySelectorAll('label');labels.forEach(l=>l.classList.remove('ok','wrong'));labels[x.a].classList.add('ok');if(chosen){answered++;if(+chosen.value===x.a)score++;else labels[+chosen.value].classList.add('wrong')}const f=card.querySelector('.feedback');f.hidden=false;f.textContent=(chosen?(+chosen.value===x.a?'Correct. ':'Review this answer. '):'Not answered. ')+'Answer: '+'ABCD'[x.a]+'. '+x.o[x.a]+'. '+x.e});document.getElementById('result').textContent='Score: '+score+' / 30 ('+Math.round(score/30*100)+'%). Unanswered: '+(30-answered)+'.'};
document.getElementById('reset').onclick=()=>{quiz.reset();quiz.querySelectorAll('label').forEach(l=>l.classList.remove('ok','wrong'));quiz.querySelectorAll('.feedback').forEach(f=>f.hidden=true);document.getElementById('result').textContent='';progress()};
</script></html>
